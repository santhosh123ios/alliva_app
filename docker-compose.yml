services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: alliva
      POSTGRES_PASSWORD: alliva
      POSTGRES_DB: alliva
    ports:
      - "5432:5432"
    volumes:
      - alliva_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alliva -d alliva"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alliva
      MINIO_ROOT_PASSWORD: alliva-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - alliva_minio:/data

volumes:
  alliva_pg:
  alliva_minio:
